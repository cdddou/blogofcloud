<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TipCarD 下载</title>
    <meta
      name="description"
      content="下载 TipCarD Android APK。"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #1f2520;
        --muted: #687069;
        --paper: #f7f4ed;
        --card: #ffffff;
        --line: #ddd7c9;
        --accent: #596d46;
        --accent-strong: #40512f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
        line-height: 1.6;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px 16px;
      }

      .panel {
        width: min(100%, 720px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        padding: clamp(24px, 5vw, 44px);
        box-shadow: 0 18px 60px rgba(46, 42, 35, 0.08);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 14px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 7vw, 56px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .summary {
        margin: 18px 0 0;
        max-width: 560px;
        color: var(--muted);
        font-size: 17px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        padding: 0 18px;
        font-weight: 700;
        text-decoration: none;
      }

      .button:hover {
        background: var(--accent-strong);
      }

      .meta {
        display: grid;
        gap: 10px;
        margin-top: 28px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
      }

      code {
        overflow-wrap: anywhere;
        color: var(--ink);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel" aria-labelledby="title">
        <p class="eyebrow">Android APK</p>
        <h1 id="title">TipCarD 下载</h1>
        <p class="summary">
          一个用于收集、整理和保存技巧卡片的 Android 应用。
        </p>
        <div class="actions">
          <a class="button" href="./TipCarD-v0.0.1.apk" download>下载 APK</a>
        </div>
        <div class="meta">
          <div>版本：0.0.1</div>
          <div>文件：<code>TipCarD-v0.0.1.apk</code></div>
          <div>SHA256：<code>CCCC73D3A7C6E33DBA08D9ABA9257CA53ABDCD2C9C347813F7CC185640C345EF</code></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="shared-title" style="margin-top:32px">
        <p class="eyebrow">共享卡片</p>
        <h2 id="shared-title" style="font-size:24px;font-weight:700;margin:0">社区分享</h2>
        <p class="summary">其他用户分享的技巧卡片。安装 App 后可以在「共享」Tab 里查看并保存。</p>
        <div id="shared-cards" class="meta" style="border-top:none;padding-top:0;margin-top:18px">
          <p class="muted">加载中…</p>
        </div>
      </section>
    </main>

    <script>
      // === GitHub 仓库配置 ===
      const GITHUB_OWNER = "cdddou";
      const GITHUB_REPO = "blogofcloud";
      const GITHUB_BRANCH = "main";
      const SHARE_PATH = "tipcard/shared-cards/index.json";

      (async function loadShared() {
        const el = document.getElementById("shared-cards");
        if (!GITHUB_OWNER || !GITHUB_REPO) {
          el.innerHTML = '<p style="color:var(--muted);font-size:14px">共享功能尚未配置 GitHub 仓库。</p>';
          return;
        }

        try {
          const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${SHARE_PATH}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error("Not found");
          const index = await res.json();
          const cards = index.cards || [];

          if (cards.length === 0) {
            el.innerHTML = '<p style="color:var(--muted);font-size:14px">还没有人分享卡片，来做第一个吧！</p>';
            return;
          }

          el.innerHTML = cards.map(c => `
            <article style="border:1px solid var(--line);border-radius:6px;padding:16px;background:var(--card)">
              <div style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
                <span style="background:#e8efe0;color:var(--accent);padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600">${esc(c.shared_category)}</span>
                <span style="background:#f0efe8;color:var(--muted);padding:2px 8px;border-radius:99px;font-size:12px">${esc(c.source_platform)}</span>
              </div>
              <h3 style="font-size:17px;font-weight:700;margin:0 0 6px">${esc(c.shared_title)}</h3>
              <p style="color:var(--muted);font-size:14px;margin:0">${esc(c.shared_summary)}</p>
              <p style="color:var(--muted);font-size:12px;margin:8px 0 0">分享者：${esc(c.shared_by_name)} · ${new Date(c.shared_at).toLocaleDateString("zh-CN")}</p>
            </article>
          `).join('<div style="height:12px"></div>');
        } catch {
          el.innerHTML = '<p style="color:var(--muted);font-size:14px">加载共享卡片失败，请稍后再试。</p>';
        }
      })();

      function esc(s) {
        const d = document.createElement("div");
        d.textContent = s || "";
        return d.innerHTML;
      }
    </script>
  </body>
</html>
